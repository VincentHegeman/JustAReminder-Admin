<div id="gate" class="login-back"><div id="gate-box" class="login-card"></div></div>
<div id="app" class="app hide">
  <aside id="side" class="side">
    <div class="logo"><div class="logo-mark">◷</div><div><div class="brand">JustAReminder</div><small>ADMIN CONSOLE</small></div></div>
    <div class="side-title">BEHEER</div>
    <button class="nav" data-nav="dashboard">◫ &nbsp; Overzicht</button>
    <button class="nav" data-nav="accounts">♙ &nbsp; Alle accounts</button>
    <button class="nav" data-nav="tables">▤ &nbsp; Gegevensbeheer</button>
    <button class="nav" data-nav="history">◴ &nbsp; Wijzigingslog</button>
    <div class="side-title">SYSTEEM</div>
    <button class="nav" data-nav="settings">⚙ &nbsp; Instellingen</button>
    <div class="side-bottom"><div class="admin-pill"><div class="avatar" id="avatar">A</div><div style="min-width:0"><b>Beheerder</b><small id="logged-as">—</small></div></div><button id="logout" class="logout">↪ Uitloggen</button></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="btnrow"><button id="mobile-menu" class="icon-btn side-mobile-toggle" title="Menu">☰</button><div><h1 id="top-title">Overzicht</h1><p>Beheeromgeving • JustAReminder</p></div></div><div class="top-actions"><span class="connected"><span class="dot"></span> Beveiligde verbinding</span><button class="icon-btn" id="refresh" title="Vernieuwen">⟳</button></div></header>
    <main class="content" id="view"><div class="loading">Dashboard laden…</div></main>
  </div>
</div>
<div id="modal-root"></div><div id="toast-host" class="toast-host"></div>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = (v, n=95) => {const s=typeof v==='object' ? JSON.stringify(v) : String(v??'—'); return s.length>n?s.slice(0,n)+'…':s;};
const nlDate = v => {if(!v)return '—';try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric'}).format(new Date(v));}catch{return '—';}};
const fullDate = v => {if(!v)return '—';try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v));}catch{return '—';}};
const nfmt=n=>Number(n??0).toLocaleString('nl-NL');
const getConfig=()=>{try{return JSON.parse(localStorage.getItem('jar_admin_config_v1')||'{}');}catch{return {};}};
const S={sb:null,me:null,authorized:false,config:getConfig(),page:'dashboard',summary:null,catalog:[],accounts:[],accTotal:0,accPage:0,accSearch:'',selected:null,accountRelated:{},note:'',table:'',tablePage:0,tableSearch:'',tableContext:null,tableData:null,history:[],loading:false};
let searchTimer=null;
function toast(msg,isError=false){const el=document.createElement('div');el.className='toast'+(isError?' err':'');el.textContent=msg;$('toast-host').appendChild(el);setTimeout(()=>el.remove(),4300);}
function errorText(e){return e?.message||String(e||'Onbekende fout');}
async function rpc(name,args={}){if(!S.sb)throw new Error('Niet verbonden');const {data,error}=await S.sb.rpc(name,args);if(error)throw error;return data;}
function gate(body){$('gate').classList.remove('hide');$('app').classList.add('hide');$('gate-box').innerHTML=body;}
function showConfig(message=''){
  gate(`<div class="login-logo">◷</div><h1>Admin Dashboard instellen</h1><p>Verbind het beheerderspaneel met jouw JustAReminder Supabase-project. De database-installatie moet eerst uitgevoerd zijn.</p>
  ${message?`<div class="form-error">${esc(message)}</div>`:''}
  <form id="config-form"><div class="field"><label>Supabase Project URL</label><input id="c-url" type="url" placeholder="https://project-id.supabase.co" required value="${esc(S.config.url||'')}"></div>
  <div class="field"><label>Publishable key / anon key</label><textarea id="c-key" placeholder="sb_publishable_... of je anon JWT" style="min-height:78px" required>${esc(S.config.key||'')}</textarea></div>
  <button class="button" type="submit">Verbinding opslaan</button></form>
  <div class="light-line"></div><div class="notice"><b>Beveiliging:</b> gebruik hier uitsluitend de <b>publishable</b> of <b>anon</b> sleutel. Nooit je service_role of secret key.</div>
  <p class="auth-small">Deze publieke configuratie wordt alleen in deze browser opgeslagen. Je logt daarna met je eigen Supabase Auth-account in.</p>`);
  $('config-form').onsubmit = (e)=>{e.preventDefault();const url=$('c-url').value.trim().replace(/\/$/,'');const key=$('c-key').value.trim();if(!/^https:\/\/[a-z\d-]+\.supabase\.co$/i.test(url)){showConfig('Gebruik je Supabase-project-URL, eindigend op .supabase.co.');return;}if(/service_role|sb_secret_/i.test(key)){showConfig('Een geheime service-role key mag nooit in een browser staan.');return;}S.config={url,key};localStorage.setItem('jar_admin_config_v1',JSON.stringify(S.config));init();};
}
function showLogin(message=''){
  gate(`<div class="login-logo">◷</div><h1>Welkom terug</h1><p>Log in met je <b>bestaande Supabase Auth-account</b> dat als beheerder is toegevoegd.</p>
  ${message?`<div class="form-error">${esc(message)}</div>`:''}
  <form id="login-form"><div class="field"><label>E-mailadres</label><input id="login-email" type="email" autocomplete="username" required placeholder="beheerder@jouwdomein.nl"></div>
  <div class="field"><label>Wachtwoord</label><input id="login-pass" type="password" autocomplete="current-password" required placeholder="Je accountwachtwoord"></div>
  <button class="button" id="do-login" type="submit">Inloggen bij JustAReminder →</button></form>
  <div class="light-line"></div><button class="button light" id="change-config">⚙ Verbindingsinstellingen</button>
  <p class="auth-small">Aanmelden verloopt via Supabase Auth. Een normale gebruiker krijgt géén toegang tot beheerfuncties.</p>`);
  $('change-config').onclick=()=>showConfig();
  $('login-form').onsubmit=async(e)=>{e.preventDefault();const btn=$('do-login');btn.disabled=true;btn.textContent='Bezig met inloggen…';try{const {error}=await S.sb.auth.signInWithPassword({email:$('login-email').value.trim(),password:$('login-pass').value});if(error)throw error;await checkAccess();}catch(err){showLogin(errorText(err));}};
}
async function init(){
 if(!S.config.url||!S.config.key){showConfig();return;}
 if(!window.supabase?.createClient){gate('<div class="login-logo">◷</div><h1>Verbinding voorbereiden</h1><p>De beveiligde aanmeldbibliotheek wordt geladen.</p><button class="button light" id="change-config-loading">Instellingen wijzigen</button>');$('change-config-loading').onclick=()=>showConfig();return;}
 try{
   S.sb=window.supabase.createClient(S.config.url,S.config.key,{auth:{persistSession:true,autoRefreshToken:true}});
   const {data,error}=await S.sb.auth.getUser();if(error||!data?.user){showLogin();return;}
   await checkAccess();
 }catch(err){showLogin(errorText(err));}

async function checkAccess(){
 const {data,error}=await S.sb.auth.getUser();if(error||!data?.user){showLogin('Je bent niet aangemeld.');return;}
 S.me=data.user;
 let allowed=false;try{allowed=await rpc('jar_admin_is_admin');}catch(err){showLogin('De beheerfuncties zijn nog niet goed geïnstalleerd: '+errorText(err));return;}
 if(!allowed){await S.sb.auth.signOut();showLogin('Dit account heeft geen beheerdersrechten. Voeg je eigen Auth User ID toe aan public.jar_admins volgens de handleiding.');return;}
 S.authorized=true;
 $('gate').classList.add('hide');$('app').classList.remove('hide');
 $('logged-as').textContent=S.me.email||'Beheerder';$('avatar').textContent=(S.me.email||'A')[0].toUpperCase();
 await loadInitial();navigate('dashboard');
}

modal(`<div class="modal-head"><h3>${canEdit?'Record bekijken & aanpassen':'Record bekijken'}</h3><button class="icon-btn" data-close-modal>×</button></div><div class="modal-body"><span class="info-tag">${esc(table)} · ${esc(rowId||'geen primaire sleutel')}</span><div class="kvlist" style="max-height:220px;overflow:auto">${values}</div>
${canEdit?`<div class="notice warning">Pas alleen het geselecteerde veld aan. De oude waarde wordt opgeslagen in het wijzigingslogboek.</div><form id="edit-form"><div class="field"><label>Veld om te wijzigen</label><select id="edit-field">${options.map(f=>`<option value="${esc(f.name)}">${esc(f.label)} (${esc(f.name)})</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Nieuwe waarde</label><div id="edit-value-wrap"></div><small id="edit-type" class="helper"></small></div><div class="field" style="margin-top:12px"><label>Reden van aanpassing (verplicht)</label><textarea id="edit-reason" required minlength="4" maxlength="500" style="min-height:80px" placeholder="Bijv. klant heeft handmatig 100 extra taken gekregen"></textarea></div></form>`:''}</div><div class="modal-foot"><button class="button light" data-close-modal>Sluiten</button>${canEdit?'<button class="button" id="save-edit">Wijziging opslaan</button>':''}</div>`);
if(canEdit){const sel=$('edit-field');const buildEditor=()=>{const f=options.find(x=>x.name===sel.value);const existing=row.record[f.name];const typ=f.type.toLowerCase();const isBool=typ==='boolean';const isNumber=/^(smallint|integer|bigint)/.test(typ);const isDate=/^(date|timestamp)/.test(typ);$('edit-type').textContent='Datatype: '+f.type+' • Huidig: '+short(existing,80);$('edit-value-wrap').innerHTML=isBool?`<select id="edit-value"><option value="true" ${existing===true?'selected':''}>Ja</option><option value="false" ${existing===false?'selected':''}>Nee</option></select>`:`<input id="edit-value" ${isNumber?'type="number" step="1"':isDate?'type="text"':'type="text"'} value="${esc(existing===null?'':existing)}" placeholder="${isDate?'2026-10-22 of 2026-10-22T15:30:00+02:00':'Nieuwe waarde'}">`;};sel.onchange=buildEditor;buildEditor();$('save-edit').onclick=async()=>{const f=options.find(x=>x.name===sel.value);const raw=$('edit-value').value;const typ=f.type.toLowerCase();let value=/^(smallint|integer|bigint)/.test(typ)?(raw===''?null:Number(raw)):typ==='boolean'?(raw==='true'):(raw===''?null:raw);const reason=$('edit-reason').value.trim();if(reason.length<4){toast('Vul een duidelijke reden in.',true);return;}if(typeof value==='number'&&!Number.isSafeInteger(value)){toast('Gebruik een geldig geheel getal.',true);return;}if(!confirm(`Wil je ${f.label} bij ${table} echt wijzigen?\n\nOud: ${short(row.record[f.name],100)}\nNieuw: ${short(value,100)}\n\nDit wordt direct opgeslagen.`))return;const btn=$('save-edit');btn.disabled=true;try{await rpc('jar_admin_update_field',{p_table:table,p_row_id:String(rowId),p_column:f.name,p_value:value,p_reason:reason});closeModal();toast('Aanpassing opgeslagen en gelogd.');S.tableData=null;await Promise.all([loadTable(),S.selected?refreshRelated():Promise.resolve()]);if(S.page==='history')await reloadHistory();}catch(e){toast('Wijziging mislukt: '+errorText(e),true);}finally{btn.disabled=false;}};}}
function openDeleteModal(){
 const a=S.selected;
 if(!a||a.is_admin||a.id===S.me?.id){toast('Een beheerdersaccount mag niet worden verwijderd.',true);return;}
 if(!a.email){toast('Dit account heeft geen e-mailadres en kan niet via deze bevestiging worden verwijderd.',true);return;}
 modal(`<form id="delete-account-form" autocomplete="off">
  <div class="modal-head"><h3 style="color:#b42338">Account definitief verwijderen</h3><button type="button" class="icon-btn" data-close-modal>×</button></div>
  <div class="modal-body">
   <div class="notice warning"><b>Dit kan niet ongedaan worden gemaakt.</b> Het Auth-account kan definitief verdwijnen en gerelateerde records kunnen door database-koppelingen worden mee-verwijderd. Andere gegevens kunnen achterblijven.</div>
   <div class="kvlist"><div><small>Te verwijderen account</small><strong>${esc(a.email)}</strong></div><div><small>User ID</small><strong class="mono">${esc(a.id)}</strong></div></div>
   <div class="field"><label>Typ exact het e-mailadres van dit account</label><input id="delete-email" type="email" required autocomplete="off" placeholder="${esc(a.email)}"></div>
   <div class="field"><label>Geheime verwijdercode</label><input id="delete-secret" type="password" required minlength="12" autocomplete="new-password" placeholder="Minimaal 12 tekens"><small class="helper">Wordt alleen voor deze aanvraag gebruikt; niet opgeslagen in je browser.</small></div>
   <label style="display:flex;align-items:flex-start;gap:10px;font-size:12px"><input id="delete-billing-confirm" type="checkbox" style="width:18px;min-height:18px;flex:none;margin-top:2px"><span>Ik heb gecontroleerd of dit account een <b>actief Mollie-abonnement</b> heeft, en indien nodig eerst in Mollie opgezegd. Dit dashboard stopt geen incasso’s.</span></label>
   <label style="display:flex;align-items:flex-start;gap:10px;font-size:12px"><input id="delete-permanent-confirm" type="checkbox" style="width:18px;min-height:18px;flex:none;margin-top:2px"><span>Ik begrijp dat het verwijderen van dit account <b>definitief</b> is en dat andere gegevens hierdoor kunnen verdwijnen.</span></label>
   <p id="delete-error" role="alert" style="font-size:12px;color:#b42338;margin:0;display:none"></p>
  </div>
  <div class="modal-foot"><button type="button" class="button light" data-close-modal>Annuleren</button><button type="submit" id="delete-submit" class="button danger" disabled>Definitief verwijderen</button></div>
 </form>`);
 const form=$('delete-account-form'), submit=$('delete-submit');
 const valid=()=>{
   submit.disabled= !($('delete-email').value.trim().toLowerCase()===a.email.trim().toLowerCase() && $('delete-secret').value.length>=12 && $('delete-billing-confirm').checked && $('delete-permanent-confirm').checked);
 };
 form.addEventListener('input',valid);form.addEventListener('change',valid);
 form.addEventListener('submit',async event=>{
  event.preventDefault();valid();if(submit.disabled)return;
  if(!confirm('LAATSTE CONTROLE: Wil je het Supabase Auth-account '+a.email+' definitief verwijderen?'))return;
  submit.disabled=true;submit.textContent='Account verwijderen…';
  const code=$('delete-secret').value;$('delete-secret').value='';
  const payload={userId:a.id,confirmEmail:$('delete-email').value.trim(),deleteCode:code,subscriptionChecked:$('delete-billing-confirm').checked,irreversibleConfirmed:$('delete-permanent-confirm').checked};
  const msg=$('delete-error');msg.style.display='none';
  try{
   const {data,error}=await S.sb.auth.getSession();
   if(error||!data?.session?.access_token)throw new Error('Je bent niet meer ingelogd. Meld je opnieuw aan.');
   const response=await fetch(S.config.url+'/functions/v1/jar-admin-delete-account',{
      method:'POST',mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',
      headers:{'Content-Type':'application/json','apikey':S.config.key,'Authorization':'Bearer '+data.session.access_token},
      body:JSON.stringify(payload)
   });
   let out={};try{out=await response.json();}catch{}
   if(!response.ok)throw new Error(out.error||('Verwijdering mislukt (HTTP '+response.status+'). Controleer of de Edge Function is geïnstalleerd.'));
   closeModal();S.selected=null;S.accountRelated={};S.note='';S.accPage=0;
   try{[S.summary]=await Promise.all([rpc('jar_admin_summary'),loadAccounts()]);}catch(loadErr){toast('Account verwijderd, maar vernieuwen mislukt: '+errorText(loadErr),true);}
   navigate('accounts');toast('Auth-account verwijderd. Controleer apart Mollie en eventueel achtergebleven klantgegevens.');
   if(out.auditWarning)toast('Account verwijderd, maar de auditregistratie behoeft controle.',true);
  }catch(err){
   if($('delete-error')){$('delete-error').textContent=errorText(err);$('delete-error').style.display='block';}
   toast('Verwijderen niet bevestigd: '+errorText(err),true);
  }finally{if($('delete-submit')){$('delete-submit').textContent='Definitief verwijderen';valid();}}
 });
}
async function refreshRelated(){if(!S.selected)return;const id=S.selected.id;const tableNames=Object.keys(S.accountRelated);const res=await Promise.allSettled(tableNames.map(t=>rpc('jar_admin_rows',{p_table:t,p_user_id:id,p_page:0,p_page_size:4})));res.forEach((r,i)=>{if(r.status==='fulfilled')S.accountRelated[tableNames[i]]=r.value;});if(S.page==='detail')render();}
async function refreshCurrent(){try{if(S.page==='detail'){await openAccount(S.selected.id);}else if(S.page==='tables'){await loadTable();}else if(S.page==='history'){await reloadHistory();}else{S.summary=await rpc('jar_admin_summary');await loadAccounts();render();}toast('Gegevens bijgewerkt');}catch(e){toast(errorText(e),true);}}
async function logout(){try{await S.sb?.auth.signOut();}finally{S.authorized=false;S.me=null;showLogin();}}
async function handleAction(action,btn){switch(action){case 'acc-prev':S.accPage=Math.max(0,S.accPage-1);await loadAccounts();render();break;case 'acc-next':S.accPage++;await loadAccounts();render();break;case 'table-prev':S.tablePage=Math.max(0,S.tablePage-1);await loadTable();break;case 'table-next':S.tablePage++;await loadTable();break;case 'table-reload':await loadTable();toast('Tabel ververst');break;case 'refresh':await refreshCurrent();break;case 'refresh-detail':await openAccount(S.selected.id);break;case 'history-reload':await reloadHistory();toast('Logboek ververst');break;case 'clear-table-filter':S.tableContext=null;S.tablePage=0;await loadTable();break;case 'save-note':if(!S.selected)return;btn.disabled=true;try{await rpc('jar_admin_set_note',{p_user_id:S.selected.id,p_note:$('account-note').value});S.note=$('account-note').value;toast('Notitie opgeslagen en gelogd.');}catch(e){toast(errorText(e),true);}finally{btn.disabled=false;}break;case 'delete-account':openDeleteModal();break;case 'copy-id':try{await navigator.clipboard.writeText(S.me.id);toast('User ID gekopieerd');}catch{toast('Kopiëren niet toegestaan. Selecteer het ID handmatig.',true);}break;case 'change-config':if(confirm('Verbindingsinstellingen aanpassen? Je wordt uitgelogd.')){await logout();showConfig();}break;}}
document.addEventListener('click',async(e)=>{let t=e.target.closest('button');if(!t)return;if(t.matches('[data-close-modal]')){closeModal();return;}if(t.dataset.nav){navigate(t.dataset.nav);return;}if(t.dataset.openAccount){await openAccount(t.dataset.openAccount);return;}if(t.dataset.openTable){S.table=t.dataset.openTable;S.tablePage=0;S.tableSearch='';S.tableContext=t.dataset.userFilter||null;S.tableData=null;navigate('tables');return;}if(t.dataset.editTable){openRow(t.dataset.editTable,t.dataset.editId,t.dataset.viewOnly==='1',t.dataset.editIndex??null);return;}if(t.dataset.action){try{await handleAction(t.dataset.action,t);}catch(err){toast(errorText(err),true);}return;}});
$('logout').onclick=logout;$('refresh').onclick=refreshCurrent;$('mobile-menu').onclick=()=>$('side').classList.toggle('open');
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('jar-supabase-ready',()=>{if(S.config.url&&S.config.key&&!S.authorized)init();});
init();
})();
</script>
</body></html>
